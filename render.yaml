services:
  - type: web
    name: senpai-poster-store-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: senpai-store-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://senpai-poster-store.onrender.com,https://senpai-poster-store-api.onrender.com
